[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dickens-references"
version = "0.1.0"
description = "Reference detection and classification in Charles Dickens's letters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Michael Göggelmann"}]
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "torch==2.5.1",
    "transformers==4.44.2",
    "datasets==2.21.0",
    "accelerate==0.34.2",
    "shap==0.46.0",
    "spacy==3.8.2",
    "nltk==3.9.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "plotly==5.24.1",
    "kaleido==0.2.1",
    "UpSetPlot==0.9.0",
    "lxml==5.3.0",
    "pyarrow==17.0.0",
    "tqdm==4.66.5",
    "tensorboard==2.18.0",
    "jupyterlab==4.3.1",
    "ipywidgets==8.1.5",
]

[project.optional-dependencies]
prompting = ["llama-cpp-python==0.3.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "corpus*", "annotations*", "document_classification*", "sentence_classification*", "prompting*"]

[tool.setuptools.package-data]
prompting = ["prompts/*.json"]
